txt(c.n,bx+140,by+110,26,'#fff','center',1);txt('Vida '+c.hp+' · Vel. '+c.sp,bx+140,by+132,13,'#ccc','center');txt(c.pas,bx+140,by+154,12,'#ffd32a','center');
c.info.forEach((s,j)=>{txt(s[0],bx+16,by+180+j*44,15,'#fff',0,1);txt(s[1],bx+16,by+199+j*44,12,'#ccc')})}}
function over(t,s,s2){x.fillStyle='#000a';x.fillRect(0,0,W,H);txt(t,W/2,230,48,'#fff','center',1);txt(s,W/2,276,20,'#ddd','center');txt(s2,W/2,320,16,'#aaa','center')}
function frame(dt){netUpd();netTick(dt);
if(state=='menu'){if(P.Digit1)sel=0;if(P.Digit2)sel=1;if(P.Digit3)sel=2;if(P.ArrowLeft||P.KeyA)sel=(sel+2)%3;if(P.ArrowRight||P.KeyD)sel=(sel+1)%3;if(P.Enter){if(mode=='solo')start(sel);else readyUp()}menu();lobby();return}
if(state=='play'){if(p.dead&&mode!='solo'){P={};K={}}upd(dt);chk()}world();
if(state=='clear'){over('Fase '+(st+1)+' concluída!','Pontos: '+sc+' · recupera 40% da vida','Enter para a próxima fase');if(P.Enter&&role!='guest'){p.hp=Math.min(p.max,p.hp+p.max*.4);p.dead=0;load(st+1);sendLoad(st,0)}}
if(state=='over'){over('Você caiu...','Pontos: '+sc,'Enter: tentar a fase de novo · Esc: menu');if(P.Enter&&role!='guest'){p.hp=p.max;p.dead=0;sc=0;load(st);sendLoad(st,1)}if(P.Escape)toMenu()}
if(state=='win'){over('VITÓRIA!','O reino está salvo · Pontos: '+sc,'Enter: voltar ao menu');if(P.Enter)toMenu()}
if(state=='vsw'||state=='vsl'){over(state=='vsw'?'VITÓRIA!':'DERROTA','Versus online','Enter: revanche · Esc: menu');if(P.Enter){send('rm',{});rematch()}if(P.Escape)toMenu()}
hostTick(dt)}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;frame(dt);P={};requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
